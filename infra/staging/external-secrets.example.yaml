apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform-staging-secrets
spec:
  provider:
    webhook:
      url: https://replace-with-staging-secrets-provider.example.com/secrets/{{ .remoteRef.key }}
      result:
        jsonPath: $.value
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: staging-seed-secret
  namespace: platform-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-staging-secrets
    kind: ClusterSecretStore
  target:
    name: staging-seed-secret
    creationPolicy: Owner
  data:
    - secretKey: STAGING_SEED_PASSWORD
      remoteRef:
        key: platform/platform-staging/seed/STAGING_SEED_PASSWORD
