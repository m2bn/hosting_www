{{- if .Values.networkPolicy.enabled }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-services.serviceName" (dict "root" $ "name" $name) }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "platform-services.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-services.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ $service.ports.http }}
  egress:
    {{- if $.Values.networkPolicy.allowDnsEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    - to:
        - podSelector: {}
    {{- range $cidr := $.Values.networkPolicy.egressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
