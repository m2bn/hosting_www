{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
{{- if $.Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "platform-services.serviceName" (dict "root" $ "name" $name) }}-secret
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "platform-services.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "platform-services.serviceName" (dict "root" $ "name" $name) }}-secret
    creationPolicy: Owner
  data:
    {{- range $key := $service.secretKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "platform/%s/%s/%s" $.Values.global.namespace $name $key | quote }}
    {{- end }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-services.serviceName" (dict "root" $ "name" $name) }}-secret
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "platform-services.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
data: {}
{{- end }}
{{- end }}
{{- end }}
