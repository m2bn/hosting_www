apiVersion: v1
kind: Pod
metadata:
  name: {{ include "platform-services.fullname" . }}-security-smoke
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "platform-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: chart-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: security-smoke
      image: busybox:1.36
      command:
        - sh
        - -c
        - "test -f /etc/resolv.conf"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
