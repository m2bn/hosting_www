global:
  namespace: platform-staging
  imagePullPolicy: IfNotPresent

externalSecrets:
  enabled: true
  secretStoreRef:
    name: platform-staging-secrets
    kind: ClusterSecretStore

services:
  api:
    replicas: 1
    config:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      SERVICE_NAME: api
      ENVIRONMENT: staging
      STRIPE_TEST_MODE: "true"
      STRIPE_CHECKOUT_SUCCESS_URL: https://app.staging.example.com/billing/success
      STRIPE_CHECKOUT_CANCEL_URL: https://app.staging.example.com/billing/cancel
      STATIC_DEPLOYMENT_STORAGE_BACKEND: s3
      STATIC_DEPLOYMENT_S3_BUCKET: replace-with-staging-platform-bucket
      CUSTOM_DOMAIN_SYSTEM_HOSTNAMES: staging.example.com,api.staging.example.com,app.staging.example.com
      CUSTOM_DOMAIN_SYSTEM_SUFFIXES: staging.example.com,apps.staging.example.com
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  dashboard:
    replicas: 1
    config:
      NODE_ENV: production
      SERVICE_NAME: dashboard
      ENVIRONMENT: staging
      NEXT_PUBLIC_API_BASE_URL: https://api.staging.example.com
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  billing-service:
    replicas: 1
    config:
      SERVICE_NAME: billing-service
      ENVIRONMENT: staging
      STRIPE_TEST_MODE: "true"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  provisioner-service:
    replicas: 1
    config:
      SERVICE_NAME: provisioner-service
      ENVIRONMENT: staging
  deployment-worker:
    replicas: 1
    config:
      SERVICE_NAME: deployment-worker
      ENVIRONMENT: staging
      STATIC_DEPLOYMENT_STORAGE_BACKEND: s3
      STATIC_DEPLOYMENT_S3_BUCKET: replace-with-staging-platform-bucket
  notification-service:
    replicas: 1
    config:
      SERVICE_NAME: notification-service
      ENVIRONMENT: staging
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  metering-service:
    replicas: 1
    config:
      SERVICE_NAME: metering-service
      ENVIRONMENT: staging
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
