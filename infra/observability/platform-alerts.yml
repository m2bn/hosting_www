groups:
  - name: platform-alerts
    rules:
      - alert: HighApiErrorRate
        expr: sum(rate(platform_http_errors_total[5m])) / clamp_min(sum(rate(platform_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API error rate is above 5%.

      - alert: BuildQueueGrowing
        expr: platform_queue_depth{queue="builds"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Build queue depth is growing.

      - alert: StripeWebhookFailures
        expr: increase(platform_stripe_webhook_failures_total[10m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Stripe webhook failures detected.

      - alert: CertificateRenewalFailure
        expr: increase(platform_certificate_renewal_failures_total[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Certificate renewal failure detected.

      - alert: CertificateExpiringSoon
        expr: platform_certificate_expires_in_seconds < 1209600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Certificate expires in less than 14 days.

      - alert: StorageAlmostFull
        expr: platform_usage_storage_ratio > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Storage usage is above 80%.

      - alert: DatabaseHighLatency
        expr: histogram_quantile(0.95, sum(rate(platform_database_query_duration_seconds_bucket[5m])) by (le)) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database p95 latency is above 250ms.

      - alert: DeploymentFailureRateHigh
        expr: sum(rate(platform_deployment_failures_total[15m])) / clamp_min(sum(rate(platform_deployments_total[15m])), 1) > 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Deployment failure rate is above 10%.
