[project]
name = "saas-hosting-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "cryptography>=42,<46",
    "djangorestframework>=3.15,<4.0",
    "celery>=5.3,<6.0",
    "kubernetes>=29,<33",
    "boto3>=1.34,<2.0",
    "stripe>=10,<14",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
